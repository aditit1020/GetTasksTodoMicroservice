apiVersion: apps/v1
kind: Deployment
metadata:
  name: appadi-get-task-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: appadi-get-task-api
  template:
    metadata:
      labels:
        app: appadi-get-task-api
    spec:
      containers:
      - name: appadi-get-task-api
        image: acrdevappadi01.azurecr.io/appadi-get-tasks-api:v1
        ports:
        - containerPort: 8000
        env: 
        - name: CONNECTION_STRING
          value: "Driver={ODBC Driver 18 for SQL Server};Server=tcp:sql-dev-appadi.database.windows.net,1433;Database=sqldb-dev-appadi;Uid=devopsadmin;Pwd=P@ssw01rd@123;Encrypt=yes;TrustServerCertificate=no;Connection Timeout=30;"
          

